<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern Clean Canvas Background with Ambient Mesh Glows -->
  <rect width="1440" height="900" fill="#F8FAFC"/>
  <circle cx="200" cy="150" r="350" fill="#DBEAFE" fill-opacity="0.35"/>
  <circle cx="1250" cy="750" r="350" fill="#D1FAE5" fill-opacity="0.25"/>

  <!-- Top Navigation Header -->
  <rect width="1440" height="72" fill="#FFFFFF" fill-opacity="0.85" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Brand Logo -->
  <rect x="64" y="16" width="40" height="40" rx="12" fill="#2563EB"/>
  <text x="76" y="42" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="bold">E</text>
  <text x="116" y="38" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="900">Edu<tspan fill="#2563EB">Sync</tspan></text>
  <text x="116" y="52" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="9" font-weight="bold">TUITION ECOSYSTEM 2026</text>

  <!-- Top Right Links -->
  <rect x="1150" y="20" width="110" height="32" rx="10" fill="#F1F5F9"/>
  <text x="1170" y="40" fill="#475569" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold">Full Platform</text>

  <rect x="1275" y="20" width="140" height="32" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="1290" y="40" fill="#065F46" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold">💬 077 129 6697</text>

  <!-- ================= CENTERED AUTH CARD ================= -->
  <rect x="480" y="105" width="480" height="680" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0px 20px 45px rgba(15, 23, 42, 0.08))"/>

  <!-- Top Switcher: Sign In vs Register -->
  <text x="560" y="145" fill="#1D4ED8" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold">Sign In</text>
  <line x1="510" y1="162" x2="690" y2="162" stroke="#1D4ED8" stroke-width="2.5"/>

  <text x="780" y="145" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold">Register New Account</text>
  <line x1="710" y1="162" x2="930" y2="162" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Welcome Title -->
  <text x="516" y="205" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-size="24" font-weight="900">Welcome back</text>
  <text x="516" y="228" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="12">Select your role and enter your credentials to sign in.</text>

  <!-- 3 Role Pills Segmented Control -->
  <rect x="516" y="250" width="408" height="44" rx="14" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Student (Inactive) -->
  <text x="552" y="277" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold">🎓 Student</text>

  <!-- Parent (Active) -->
  <rect x="652" y="254" width="136" height="36" rx="10" fill="#FFFFFF" filter="drop-shadow(0px 2px 8px rgba(15, 23, 42, 0.08))"/>
  <text x="686" y="277" fill="#1D4ED8" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold">👨‍👩‍👧 Parent</text>

  <!-- Teacher (Inactive) -->
  <text x="830" y="277" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold">👨‍🏫 Teacher</text>

  <!-- Input Field 1: Parent ID / Child ID -->
  <text x="516" y="325" fill="#334155" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold">Parent ID (PID-XXXX) or Child's Student ID</text>
  <rect x="516" y="338" width="408" height="48" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="536" y="368" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="16">👨‍👩‍👧</text>
  <text x="562" y="368" fill="#0F172A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold">PID-8492</text>
  <text x="516" y="402" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="11">Parents can log in with PID-8492, Child's STU-9402, or Phone</text>

  <!-- Input Field 2: Password -->
  <text x="516" y="435" fill="#334155" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold">Password</text>
  <text x="880" y="435" fill="#2563EB" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold">Forgot?</text>
  <rect x="516" y="448" width="408" height="48" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="536" y="478" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="16">🔑</text>
  <text x="562" y="480" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-size="20">••••••••••</text>
  <text x="895" y="478" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="14">👁</text>

  <!-- Remember Me & Security Status -->
  <rect x="516" y="515" width="16" height="16" rx="4" fill="#2563EB"/>
  <text x="520" y="527" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="bold">✓</text>
  <text x="540" y="528" fill="#475569" font-family="Plus Jakarta Sans, sans-serif" font-size="12">Remember on this device</text>
  <text x="814" y="528" fill="#059669" font-family="JetBrains Mono, monospace" font-size="10" font-weight="bold">● HARDWARE BOUND</text>

  <!-- Primary Sign In Button -->
  <rect x="516" y="555" width="408" height="52" rx="14" fill="#2563EB" filter="drop-shadow(0px 8px 16px rgba(37, 99, 235, 0.25))"/>
  <text x="645" y="587" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold">Sign In as Parent →</text>

  <!-- Divider -->
  <line x1="516" y1="635" x2="924" y2="635" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Subtle Bottom Discreet Admin Link -->
  <text x="635" y="668" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="12">Institute Staff? <tspan fill="#475569" font-weight="bold">Log in as Admin →</tspan></text>

  <!-- Footer -->
  <text x="640" y="845" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="11">EduSync SDGP 2026 • Group CS76</text>
</svg>