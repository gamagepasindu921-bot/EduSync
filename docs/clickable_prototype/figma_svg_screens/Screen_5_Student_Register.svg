  <text x="726" y="612" fill="#334155" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold">Confirm Password</text>
  <rect x="726" y="622" width="234" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="741" y="646" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-size="14">••••••••••</text>

