  <rect x="30" y="492" width="390" height="210" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  
  <rect x="45" y="508" width="110" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
