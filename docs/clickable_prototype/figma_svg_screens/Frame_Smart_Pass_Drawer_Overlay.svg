<svg width="450" height="1060" viewBox="0 0 450 1060" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="card-shadow" x="15" y="185" width="420" height="250" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="card-grad" x1="30" y1="194" x2="420" y2="414" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="chip-grad" x1="345" y1="255" x2="385" y2="285" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- ================= DRAWER PANEL BACKGROUND (450px x 1060px) ================= -->
  <rect width="450" height="1060" fill="#FFFFFF"/>
  <line x1="0" y1="0" x2="0" y2="1060" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ================= 1. DRAWER TOP HEADER ================= -->
  <rect width="450" height="80" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
  
  <rect x="30" y="22" width="38" height="38" rx="12" fill="#EFF6FF"/>
  <rect x="40" y="33" width="18" height="14" rx="2" stroke="#2563EB" stroke-width="2"/>
  <line x1="40" y1="38" x2="58" y2="38" stroke="#2563EB" stroke-width="2"/>
  
  <text x="80" y="38" fill="#0F172A" font-family="Montserrat, sans-serif" font-size="15" font-weight="800">Student Profile &amp; Smart Pass</text>
  <text x="80" y="52" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">CARD UID: 04:7A:B2:9C:11</text>

  <!-- Close "X" Button (Target for Close Overlay) -->
  <circle cx="410" cy="40" r="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M404 34L416 46M416 34L404 46" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- ================= 2. STUDENT BIO CAPSULE ================= -->
  <rect x="30" y="100" width="390" height="74" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="65" cy="137" r="22" fill="#E2E8F0"/>
  <text x="56" y="143" fill="#2563EB" font-family="Montserrat, sans-serif" font-size="14" font-weight="900">PN</text>
  
  <text x="100" y="126" fill="#0F172A" font-family="Montserrat, sans-serif" font-size="14" font-weight="800">Pasindu Nethsara</text>
  <text x="100" y="142" fill="#2563EB" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">STU-9402 • 2027 A/L Physical Science</text>
  <circle cx="102" cy="156" r="3" fill="#10B981"/>
  <text x="110" y="160" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Guardian: +94 77 129 6697 (SMS Delivery Verified)</text>

  <!-- ================= 3. PHOTOREALISTIC FINTECH SMART PASS ================= -->
  <g filter="url(#card-shadow)">
    <rect x="30" y="194" width="390" height="220" rx="22" fill="url(#card-grad)"/>
  </g>

  <!-- Card Brand & Contactless Symbol -->
  <text x="55" y="228" fill="#60A5FA" font-family="Montserrat, sans-serif" font-size="13" font-weight="900" letter-spacing="1">EduSync Smart Pass</text>
  <rect x="345" y="214" width="50" height="18" rx="6" fill="#FFFFFF" fill-opacity="0.15"/>
  <text x="353" y="227" fill="#E2E8F0" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700">13.56MHz</text>

  <!-- Gold Microchip -->
  <rect x="345" y="255" width="48" height="36" rx="6" fill="url(#chip-grad)" stroke="#F59E0B" stroke-width="1"/>
  <line x1="345" y1="267" x2="393" y2="267" stroke="#78350F" stroke-width="1"/>
  <line x1="345" y1="279" x2="393" y2="279" stroke="#78350F" stroke-width="1"/>
  <line x1="369" y1="255" x2="369" y2="291" stroke="#78350F" stroke-width="1"/>

  <!-- Cardholder Details -->
  <text x="55" y="270" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" letter-spacing="1">CARDHOLDER</text>
  <text x="55" y="292" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">PASINDU NETHSARA</text>
  <text x="55" y="310" fill="#7DD3FC" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">STU-9402 • HALL 04 PRIORITY</text>

  <!-- Balance Section -->
  <line x1="55" y1="334" x2="395" y2="334" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
  <text x="55" y="356" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700">PREPAID TUITION BALANCE</text>
  <text x="55" y="386" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="22" font-weight="900">LKR 8,400.00</text>
  
  <text x="320" y="360" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700">NFC UID</text>
  <text x="285" y="378" fill="#E2E8F0" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">04:7A:B2:9C:11</text>

