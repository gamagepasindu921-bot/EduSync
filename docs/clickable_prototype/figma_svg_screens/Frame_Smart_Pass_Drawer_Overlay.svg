  <text x="345" y="839" fill="#475569" font-family="JetBrains Mono, monospace" font-size="9" font-weight="800">VERIFIED ✓</text>

  <!-- Guardian SMS Notice -->
  <rect x="30" y="876" width="390" height="44" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <circle cx="50" cy="898" r="3.5" fill="#16A34A"/>
  <text x="65" y="895" fill="#166534" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700">Instant SMS Alert Active</text>
  <text x="65" y="908" fill="#15803D" font-family="Plus Jakarta Sans, sans-serif" font-size="9">Parent phone <tspan font-family="JetBrains Mono, monospace" font-weight="700">+94 77 129 6697</tspan> notified upon every turnstile tap.</text>

  <!-- Sign Out Button -->
  <rect x="30" y="940" width="390" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="180" y="966" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700">Sign Out of Student Portal</text>
</svg>