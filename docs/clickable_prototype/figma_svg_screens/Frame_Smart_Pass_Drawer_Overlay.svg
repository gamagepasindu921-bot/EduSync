  <text x="30" y="730" fill="#0F172A" font-family="Montserrat, sans-serif" font-size="13" font-weight="800">Recent Turnstile Gate Swipes</text>
  <text x="370" y="730" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="10">TODAY</text>

  <!-- Swipe Log 1 -->
