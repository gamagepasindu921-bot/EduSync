  <circle cx="50" cy="772" r="4" fill="#10B981"/>
  <text x="65" y="765" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700">Hall 04 Entrance Gate A2</text>
  <text x="65" y="781" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="10">08:02:14 AM • Fee: -LKR 4,000</text>
  <rect x="330" y="760" width="75" height="22" rx="6" fill="#DCFCE7"/>
  <text x="338" y="775" fill="#15803D" font-family="JetBrains Mono, monospace" font-size="9" font-weight="800">DEDUCTED ✓</text>

