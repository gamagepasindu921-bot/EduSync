  <rect x="30" y="432" width="188" height="42" rx="12" fill="#2563EB"/>
  <text x="80" y="458" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800">+ Top Up Balance</text>

  <rect x="232" y="432" width="188" height="42" rx="12" fill="#0F172A"/>
  <text x="275" y="458" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800">Emergency QR Pass</text>

