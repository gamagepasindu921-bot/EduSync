  <rect x="61" y="524" width="20" height="20" fill="#FFFFFF"/>
  <rect x="65" y="528" width="12" height="12" fill="#0F172A"/>

  <rect x="115" y="520" width="28" height="28" fill="#0F172A"/>
  <rect x="119" y="524" width="20" height="20" fill="#FFFFFF"/>
  <rect x="123" y="528" width="12" height="12" fill="#0F172A"/>

  <rect x="57" y="578" width="28" height="28" fill="#0F172A"/>
  <rect x="61" y="582" width="20" height="20" fill="#FFFFFF"/>
  <rect x="65" y="586" width="12" height="12" fill="#0F172A"/>

  <rect x="93" y="535" width="14" height="14" fill="#0F172A"/>
  <rect x="93" y="560" width="14" height="30" fill="#0F172A"/>
  <rect x="115" y="560" width="28" height="12" fill="#0F172A"/>
  <rect x="125" y="580" width="18" height="26" fill="#0F172A"/>

  <text x="170" y="530" fill="#0F172A" font-family="Montserrat, sans-serif" font-size="13" font-weight="800">Dynamic Gate Pass</text>
  <text x="170" y="546" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Show this optical QR if you forgot</text>
  <text x="170" y="560" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="10">your physical plastic NFC Smart Pass.</text>

  <rect x="170" y="574" width="230" height="30" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <circle cx="185" cy="589" r="3.5" fill="#10B981"/>
  <text x="195" y="593" fill="#065F46" font-family="JetBrains Mono, monospace" font-size="10" font-weight="800">OTP: 894-012 • REFRESH 24s</text>

  <rect x="45" y="630" width="360" height="54" rx="10" fill="#EFF6FF"/>
  <text x="60" y="652" fill="#1E40AF" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700">🔒 Anti-Screenshot Security Feature</text>
  <text x="60" y="668" fill="#3B82F6" font-family="Plus Jakarta Sans, sans-serif" font-size="9">Code rotates every 30 seconds. Prevents sharing gate passes with unauthorized students.</text>

