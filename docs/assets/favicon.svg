<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#blueGrad)" />

  <!-- Smart Card Graphic -->
  <rect x="22" y="32" width="84" height="54" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Gold Chip -->
  <rect x="32" y="44" width="20" height="15" rx="3" fill="url(#chipGrad)"/>

  <!-- NFC Waves in White -->
  <path d="M 72 44 A 8 8 0 0 1 72 58" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 79 40 A 14 14 0 0 1 79 62" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 86 36 A 20 20 0 0 1 86 66" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Live Pulse Dot -->
  <circle cx="94" cy="94" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
</svg>
